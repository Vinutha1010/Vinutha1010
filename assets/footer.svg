<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF69B4">
        <animate attributeName="stop-color" values="#FF69B4;#A855F7;#FF1493;#FF69B4" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FF1493">
        <animate attributeName="stop-color" values="#FF1493;#FF69B4;#A855F7;#FF1493" dur="5s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#FF1493;#FF69B4;#A855F7" dur="5s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="fglow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatPulse {
        0%, 100% { opacity: 0.7; transform: translateY(0px); }
        50% { opacity: 1; transform: translateY(-2px); }
      }
      .footer-txt {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-weight: 600;
        letter-spacing: 3px;
        animation: floatPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="5" y="5" width="890" height="120" rx="14" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="1.8" />

  <!-- Neon Wave Paths -->
  <path d="M 10 40 Q 225 15, 450 40 T 890 40" fill="none" stroke="#FF69B4" stroke-opacity="0.18" stroke-width="2">
    <animate attributeName="d" values="M 10 40 Q 225 15, 450 40 T 890 40; M 10 40 Q 225 65, 450 40 T 890 40; M 10 40 Q 225 15, 450 40 T 890 40" dur="6s" repeatCount="indefinite" />
  </path>
  
  <path d="M 10 75 Q 225 95, 450 75 T 890 75" fill="none" stroke="#A855F7" stroke-opacity="0.18" stroke-width="2">
    <animate attributeName="d" values="M 10 75 Q 225 95, 450 75 T 890 75; M 10 75 Q 225 55, 450 75 T 890 75; M 10 75 Q 225 95, 450 75 T 890 75" dur="6s" repeatCount="indefinite" />
  </path>

  <!-- Ambient Glow -->
  <circle cx="450" cy="65" r="80" fill="#FF69B4" opacity="0.07" filter="url(#fglow)" />

  <!-- Center Text -->
  <text x="450" y="60" text-anchor="middle" fill="#FFFFFF" font-size="14" class="footer-txt" filter="url(#fglow)">
    ✦ CRAFTED WITH ELEGANCE &amp; PRECISION BY VINUTHA ✦
  </text>
  
  <text x="450" y="85" text-anchor="middle" fill="#FF69B4" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="500">
    Full-Stack Developer • Java Specialist • Open Source Contributor
  </text>
</svg>
