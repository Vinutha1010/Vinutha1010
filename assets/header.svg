<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="100%">
  <defs>
    <!-- Background Obsidian Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070A" />
      <stop offset="45%" stop-color="#16121E" />
      <stop offset="75%" stop-color="#120F19" />
      <stop offset="100%" stop-color="#08070A" />
    </linearGradient>

    <!-- Animated Neon Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4">
        <animate attributeName="stop-color" values="#FF69B4;#FF1493;#A855F7;#FFB6C1;#FF69B4" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="35%" stop-color="#FF1493">
        <animate attributeName="stop-color" values="#FF1493;#A855F7;#FFB6C1;#FF69B4;#FF1493" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="70%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#FFB6C1;#FF69B4;#FF1493;#A855F7" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FFB6C1">
        <animate attributeName="stop-color" values="#FFB6C1;#FF69B4;#FF1493;#A855F7;#FFB6C1" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Shimmering Text Gradient -->
    <linearGradient id="textShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF0F5" />
      <stop offset="25%" stop-color="#FFB6C1" />
      <stop offset="50%" stop-color="#FF69B4" />
      <stop offset="75%" stop-color="#FFB6C1" />
      <stop offset="100%" stop-color="#FFF0F5" />
      <animate attributeName="x1" values="-100%;100%" dur="5s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="5s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Badge Background Gradient -->
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255, 105, 180, 0.15)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0.15)" />
    </linearGradient>

    <!-- Deep Glow Filters -->
    <filter id="pinkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(6px) rotate(-6deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(0.95); }
        50% { opacity: 0.95; transform: scale(1.15); }
      }
      @keyframes pulseBadge {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes travelLight {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(200%); }
      }

      .floating-item-1 { animation: floatSlow 5s ease-in-out infinite; }
      .floating-item-2 { animation: floatReverse 6s ease-in-out infinite 0.8s; }
      .floating-item-3 { animation: floatSlow 4.5s ease-in-out infinite 1.5s; }
      
      .sparkle-1 { animation: pulseGlow 2.8s ease-in-out infinite; }
      .sparkle-2 { animation: pulseGlow 3.6s ease-in-out infinite 0.9s; }
      .sparkle-3 { animation: pulseGlow 2.4s ease-in-out infinite 1.7s; }
      .sparkle-4 { animation: pulseGlow 3.1s ease-in-out infinite 1.2s; }

      .pulse-dot { animation: pulseBadge 1.8s ease-in-out infinite; }

      .name-text {
        font-family: 'Playfair Display', 'Georgia', -apple-system, BlinkMacSystemFont, serif;
        font-weight: 700;
        letter-spacing: 5px;
      }
      .tagline-text {
        font-family: 'Quicksand', 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 600;
        letter-spacing: 3px;
      }
      .chip-text {
        font-family: 'Fira Code', 'SF Mono', Consolas, monospace;
        font-weight: 500;
        font-size: 11.5px;
        letter-spacing: 1px;
      }
      .status-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        font-weight: 700;
        font-size: 10.5px;
        letter-spacing: 1.5px;
      }
    </style>
  </defs>

  <!-- Ambient Glow Orbs -->
  <circle cx="160" cy="80" r="110" fill="#FF69B4" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="760" cy="170" r="130" fill="#A855F7" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="460" cy="125" r="90" fill="#FF1493" opacity="0.08" filter="url(#softGlow)" />

  <!-- Outer Card Frame with Animated Glow Border -->
  <rect x="6" y="6" width="908" height="238" rx="22" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Inner Subtle Glass Border -->
  <rect x="14" y="14" width="892" height="222" rx="16" fill="none" stroke="#FFB6C1" stroke-opacity="0.1" stroke-width="1" />

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g stroke="#FF69B4" stroke-opacity="0.04" stroke-width="1">
    <line x1="14" y1="65" x2="906" y2="65" />
    <line x1="14" y1="125" x2="906" y2="125" />
    <line x1="14" y1="185" x2="906" y2="185" />
    <line x1="220" y1="14" x2="220" y2="236" />
    <line x1="460" y1="14" x2="460" y2="236" />
    <line x1="700" y1="14" x2="700" y2="236" />
  </g>

  <!-- Floating Sparkles & Star Elements -->
  <!-- Sparkle 1 Left -->
  <g class="sparkle-1" transform="translate(90, 60)">
    <path d="M 0,-12 Q 0,0 12,0 Q 0,0 0,12 Q 0,0 -12,0 Q 0,0 0,-12 Z" fill="#FFB6C1" />
  </g>
  <!-- Sparkle 2 Right -->
  <g class="sparkle-2" transform="translate(830, 75)">
    <path d="M 0,-14 Q 0,0 14,0 Q 0,0 0,14 Q 0,0 -14,0 Q 0,0 0,-14 Z" fill="#FF69B4" />
  </g>
  <!-- Sparkle 3 Lower Left -->
  <g class="sparkle-3" transform="translate(130, 185)">
    <path d="M 0,-9 Q 0,0 9,0 Q 0,0 0,9 Q 0,0 -9,0 Q 0,0 0,-9 Z" fill="#A855F7" />
  </g>
  <!-- Sparkle 4 Lower Right -->
  <g class="sparkle-4" transform="translate(790, 195)">
    <path d="M 0,-10 Q 0,0 10,0 Q 0,0 0,10 Q 0,0 -10,0 Q 0,0 0,-10 Z" fill="#FFB6C1" />
  </g>

  <!-- Floating Star Gems -->
  <text x="65" y="140" fill="#FF69B4" font-size="16" opacity="0.65" class="floating-item-1">✧</text>
  <text x="850" y="145" fill="#FFB6C1" font-size="18" opacity="0.7" class="floating-item-2">✦</text>
  <text x="180" y="45" fill="#A855F7" font-size="14" opacity="0.55" class="floating-item-3">✦</text>
  <text x="740" y="50" fill="#FF69B4" font-size="14" opacity="0.6" class="floating-item-1">✧</text>

  <!-- Top Status Badge: "OPEN TO OPPORTUNITIES" -->
  <g transform="translate(345, 32)">
    <rect x="0" y="0" width="230" height="28" rx="14" fill="url(#badgeBg)" stroke="#FF69B4" stroke-width="1.2" stroke-opacity="0.6" filter="url(#pinkGlow)" />
    <!-- Pulsing Hot Pink Dot -->
    <circle cx="20" cy="14" r="5" fill="#FF69B4" class="pulse-dot" />
    <circle cx="20" cy="14" r="9" fill="#FF69B4" opacity="0.35" class="pulse-dot" />
    <text x="35" y="18" fill="#FFF0F5" class="status-text">OPEN TO OPPORTUNITIES</text>
  </g>

  <!-- Main Hero Name: VINUTHA -->
  <text x="460" y="112" text-anchor="middle" fill="url(#textShimmer)" font-size="44" class="name-text" filter="url(#pinkGlow)">
    VINUTHA
  </text>

  <!-- Tagline: Software Engineering with Elegance & Precision -->
  <text x="460" y="148" text-anchor="middle" fill="#FFB6C1" font-size="14.5" class="tagline-text">
    ✦ SOFTWARE ENGINEERING WITH ELEGANCE &amp; PRECISION ✦
  </text>

  <!-- Skill Pill Badges Row -->
  <g transform="translate(195, 178)">
    <!-- Pill 1: Full-Stack Web -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="160" height="30" rx="15" fill="#181520" stroke="#FF69B4" stroke-width="1.1" stroke-opacity="0.5" />
      <text x="80" y="19" text-anchor="middle" fill="#FFF0F5" class="chip-text">☕ JAVA SYSTEMS</text>
    </g>

    <!-- Pill 2: Full-Stack & Web -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="170" height="30" rx="15" fill="#181520" stroke="#FF1493" stroke-width="1.1" stroke-opacity="0.5" />
      <text x="85" y="19" text-anchor="middle" fill="#FFF0F5" class="chip-text">⚡ FULL-STACK WEB</text>
    </g>

    <!-- Pill 3: AI & Scalable Systems -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="160" height="30" rx="15" fill="#181520" stroke="#A855F7" stroke-width="1.1" stroke-opacity="0.5" />
      <text x="80" y="19" text-anchor="middle" fill="#FFF0F5" class="chip-text">🤖 AI &amp; ARCHITECTURE</text>
    </g>
  </g>

</svg>
