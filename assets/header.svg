<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d12" />
    </linearGradient>

    <!-- Glowing Border Gradient with Animation -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4">
        <animate attributeName="stop-color" values="#FF69B4;#A855F7;#FF1493;#FF69B4" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FF1493">
        <animate attributeName="stop-color" values="#FF1493;#FF69B4;#A855F7;#FF1493" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#FF1493;#FF69B4;#A855F7" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Text Shimmer Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FF69B4" />
      <stop offset="60%" stop-color="#FF1493" />
      <stop offset="100%" stop-color="#FFFFFF" />
      <animate attributeName="x1" values="-100%;100%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }
      @keyframes pulseStar {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(300%); }
      }
      .floating {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .star-1 { animation: pulseStar 2s ease-in-out infinite; }
      .star-2 { animation: pulseStar 3s ease-in-out infinite 0.7s; }
      .star-3 { animation: pulseStar 2.5s ease-in-out infinite 1.4s; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
        font-weight: 800;
        letter-spacing: 4px;
      }
      .sub-text {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-weight: 500;
        letter-spacing: 2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-weight: 600;
        font-size: 11px;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="5" y="5" width="890" height="250" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="80" r="100" fill="#FF69B4" opacity="0.08" filter="url(#glow)" />
  <circle cx="700" cy="180" r="120" fill="#A855F7" opacity="0.08" filter="url(#glow)" />

  <!-- Cyber Grid Pattern Lines -->
  <g stroke="#FF69B4" stroke-opacity="0.06" stroke-width="1">
    <line x1="5" y1="65" x2="895" y2="65" />
    <line x1="5" y1="130" x2="895" y2="130" />
    <line x1="5" y1="195" x2="895" y2="195" />
    <line x1="180" y1="5" x2="180" y2="255" />
    <line x1="450" y1="5" x2="450" y2="255" />
    <line x1="720" y1="5" x2="720" y2="255" />
  </g>

  <!-- Animated Stars / Sparkles -->
  <circle cx="120" cy="50" r="2.5" fill="#FF69B4" class="star-1" />
  <circle cx="780" cy="60" r="3" fill="#FF1493" class="star-2" />
  <circle cx="830" cy="190" r="2" fill="#A855F7" class="star-3" />
  <circle cx="80" cy="200" r="2" fill="#FFFFFF" class="star-2" />
  <circle cx="640" cy="40" r="2" fill="#FF69B4" class="star-1" />

  <!-- Main Title Area -->
  <g class="floating">
    <!-- Greeting Small -->
    <text x="450" y="58" text-anchor="middle" fill="#FF69B4" font-size="14" class="sub-text" filter="url(#subtleGlow)">
      ✦ WELCOME TO THE DIGITAL WORKSPACE OF ✦
    </text>

    <!-- Main Name -->
    <text x="450" y="112" text-anchor="middle" fill="url(#textGrad)" font-size="44" class="title-text" filter="url(#subtleGlow)">
      VINUTHA
    </text>

    <!-- Subtitle / Tagline -->
    <text x="450" y="148" text-anchor="middle" fill="#E2E8F0" font-size="14" class="sub-text">
      SOFTWARE ENGINEER  //  JAVA &amp; FULL-STACK  //  AI ARCHITECTURE
    </text>
  </g>

  <!-- Interactive Badges Row -->
  <g transform="translate(0, 175)">
    <!-- Badge 1: CGPA -->
    <g transform="translate(110, 0)">
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#18181B" stroke="#FF69B4" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="16" cy="17" r="4" fill="#FF69B4">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="75" y="21" text-anchor="middle" fill="#FFFFFF" class="badge-text">⚡ 9.13 / 10.0 CGPA</text>
    </g>

    <!-- Badge 2: Role -->
    <g transform="translate(265, 0)">
      <rect x="0" y="0" width="170" height="34" rx="8" fill="#18181B" stroke="#A855F7" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="16" cy="17" r="4" fill="#A855F7">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="0.5s" />
      </circle>
      <text x="90" y="21" text-anchor="middle" fill="#FFFFFF" class="badge-text">💼 Codveda Java Intern</text>
    </g>

    <!-- Badge 3: Award -->
    <g transform="translate(450, 0)">
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#18181B" stroke="#FF1493" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="16" cy="17" r="4" fill="#FF1493">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="1s" />
      </circle>
      <text x="95" y="21" text-anchor="middle" fill="#FFFFFF" class="badge-text">🥇 1st Place PALS Winner</text>
    </g>

    <!-- Badge 4: Focus -->
    <g transform="translate(645, 0)">
      <rect x="0" y="0" width="145" height="34" rx="8" fill="#18181B" stroke="#FF69B4" stroke-width="1.2" stroke-opacity="0.8" />
      <circle cx="16" cy="17" r="4" fill="#FF69B4">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" begin="1.5s" />
      </circle>
      <text x="78" y="21" text-anchor="middle" fill="#FFFFFF" class="badge-text">🚀 Open to Roles</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="50" y1="240" x2="850" y2="240" stroke="url(#borderGrad)" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
