<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08070A" />
      <stop offset="50%" stop-color="#16121E" />
      <stop offset="100%" stop-color="#08070A" />
    </linearGradient>

    <!-- Animated Border Gradient -->
    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF69B4">
        <animate attributeName="stop-color" values="#FF69B4;#A855F7;#FF1493;#FF69B4" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FF1493">
        <animate attributeName="stop-color" values="#FF1493;#FF69B4;#A855F7;#FF1493" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#FF1493;#FF69B4;#A855F7" dur="7s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="footerGlow">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatPulse {
        0%, 100% { opacity: 0.85; transform: translateY(0px); }
        50% { opacity: 1; transform: translateY(-2px); }
      }
      @keyframes rotateStar {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .footer-txt-main {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 700;
        letter-spacing: 4px;
        animation: floatPulse 3.5s ease-in-out infinite;
      }
      .footer-txt-sub {
        font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
        font-weight: 600;
        letter-spacing: 2.5px;
      }
      .star-rot-1 {
        transform-origin: 180px 75px;
        animation: rotateStar 12s linear infinite;
      }
      .star-rot-2 {
        transform-origin: 740px 75px;
        animation: rotateStar 12s linear infinite reverse;
      }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="460" cy="80" r="100" fill="#FF69B4" opacity="0.09" filter="url(#footerGlow)" />

  <!-- Card Frame -->
  <rect x="6" y="6" width="908" height="148" rx="20" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="1.8" />
  <rect x="14" y="14" width="892" height="132" rx="14" fill="none" stroke="#FFB6C1" stroke-opacity="0.08" stroke-width="1" />

  <!-- Animated Neon Ambient Waves -->
  <path d="M 15 65 Q 235 30, 460 65 T 905 65" fill="none" stroke="#FF69B4" stroke-opacity="0.18" stroke-width="2">
    <animate attributeName="d" values="M 15 65 Q 235 30, 460 65 T 905 65; M 15 65 Q 235 100, 460 65 T 905 65; M 15 65 Q 235 30, 460 65 T 905 65" dur="7s" repeatCount="indefinite" />
  </path>
  
  <path d="M 15 95 Q 235 125, 460 95 T 905 95" fill="none" stroke="#A855F7" stroke-opacity="0.18" stroke-width="2">
    <animate attributeName="d" values="M 15 95 Q 235 125, 460 95 T 905 95; M 15 95 Q 235 60, 460 95 T 905 95; M 15 95 Q 235 125, 460 95 T 905 95" dur="7s" repeatCount="indefinite" />
  </path>

  <!-- Side Sparkle Stars -->
  <g class="star-rot-1">
    <text x="175" y="80" fill="#FFB6C1" font-size="18" text-anchor="middle" opacity="0.75">✦</text>
  </g>
  <g class="star-rot-2">
    <text x="745" y="80" fill="#FFB6C1" font-size="18" text-anchor="middle" opacity="0.75">✦</text>
  </g>

  <!-- Center Signature Text -->
  <text x="460" y="68" text-anchor="middle" fill="#FFF0F5" font-size="15.5" class="footer-txt-main" filter="url(#footerGlow)">
    ✦ CRAFTED WITH ELEGANCE &amp; PRECISION BY VINUTHA ✦
  </text>
  
  <!-- Subtitle -->
  <text x="460" y="102" text-anchor="middle" fill="#FF69B4" font-size="11.5" class="footer-txt-sub">
    FULL-STACK WEB • JAVA SPECIALIST • SCALABLE ARCHITECTURE
  </text>
</svg>
