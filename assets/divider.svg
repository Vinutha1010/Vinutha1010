<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="100%" height="24">
  <defs>
    <!-- Traveling Glow Laser -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF69B4" stop-opacity="0" />
      <stop offset="30%" stop-color="#FF69B4" stop-opacity="0.3" />
      <stop offset="48%" stop-color="#FF1493" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="52%" stop-color="#FF1493" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF69B4" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FFB6C1" stop-opacity="1">
        <animate attributeName="stop-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0">
        <animate attributeName="stop-opacity" values="0;0.8;0" dur="3s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Star Glow Filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseStar {
        0%, 100% { transform: scale(0.85) rotate(0deg); opacity: 0.7; }
        50% { transform: scale(1.25) rotate(90deg); opacity: 1; filter: drop-shadow(0 0 6px #FF69B4); }
      }
      @keyframes pulseDot {
        0%, 100% { transform: scale(0.8); opacity: 0.4; }
        50% { transform: scale(1.4); opacity: 1; }
      }
      .center-star {
        transform-origin: 450px 12px;
        animation: pulseStar 3s ease-in-out infinite;
      }
      .dot-left {
        transform-origin: 390px 12px;
        animation: pulseDot 2.4s ease-in-out infinite 0.4s;
      }
      .dot-right {
        transform-origin: 510px 12px;
        animation: pulseDot 2.4s ease-in-out infinite 0.8s;
      }
    </style>
  </defs>

  <!-- Base Subtle Neon Line -->
  <line x1="50" y1="12" x2="850" y2="12" stroke="url(#lineGrad)" stroke-width="1.6" />

  <!-- Active Shimmer Overlay Line -->
  <line x1="120" y1="12" x2="780" y2="12" stroke="url(#laserGrad)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Left Side Accent Dots -->
  <circle cx="390" cy="12" r="2.2" fill="#FF69B4" class="dot-left" />
  <circle cx="320" cy="12" r="1.5" fill="#FFB6C1" opacity="0.6" />
  <circle cx="250" cy="12" r="1" fill="#A855F7" opacity="0.4" />

  <!-- Center Glowing Sparkle Starburst -->
  <g class="center-star" filter="url(#starGlow)">
    <path d="M 450,4 Q 450,12 458,12 Q 450,12 450,20 Q 450,12 442,12 Q 450,12 450,4 Z" fill="#FFF0F5" stroke="#FF69B4" stroke-width="0.8" />
  </g>

  <!-- Right Side Accent Dots -->
  <circle cx="510" cy="12" r="2.2" fill="#FF1493" class="dot-right" />
  <circle cx="580" cy="12" r="1.5" fill="#FFB6C1" opacity="0.6" />
  <circle cx="650" cy="12" r="1" fill="#A855F7" opacity="0.4" />
</svg>
